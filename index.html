/* Texte unter einer Bildfläche: Reihenfolge der Felder je Bereich
   (1. Feld = Titel/Beschriftung, 2. Feld = Meta/Notiz). */
const MV_TXT_ORDER={lk:["title","meta"],pc:["title","meta"],sk:["title","note"],mb:["cap"],ib:["cap"]};
function mvReadTxt(A,kind,i){return (MV_TXT_ORDER[kind]||[]).map(f=>{const v=A.txt[f]?A.txt[f][i]:undefined;return (v==null)?"":String(v);});}
function mvClearTxt(A,kind,i){(MV_TXT_ORDER[kind]||[]).forEach(f=>{if(A.txt[f])delete A.txt[f][i];});}
/* Werte in die Textfelder des Ziels schreiben. Hat das Ziel weniger Felder,
   werden die übrigen Texte ins letzte Feld übernommen — es geht nichts verloren. */
function mvWriteTxt(B,kind,j,vals){
  const fs=MV_TXT_ORDER[kind]||[];if(!fs.length)return;
  const out=fs.map((f,k)=>vals[k]||"");
  if(vals.length>fs.length){
    const rest=vals.slice(fs.length-1).filter(v=>String(v).trim());
    out[fs.length-1]=rest.join(" \u2014 ");
  }
  fs.forEach((f,k)=>{if(!B.txt[f])return;if(out[k]!=="")B.txt[f][j]=out[k];else delete B.txt[f][j];});
}
/* Alles, was an einer Bildfläche hängt, zwischen zwei Flächen tauschen:
   Texte, Saison-Auswahl (Sketches), „verwendet“-Markierung (Inspiration),
   Produktionsdaten (Pieces). */
function swapLocMeta(locA,locB){
  const a=mvSource(locA),b=mvSource(locB);if(!a||!b)return;
  if(a.kind===b.kind&&a.sea===b.sea&&(a.cat||null)===(b.cat||null)&&a.i===b.i)return;
  const A=mvArea(a.kind,a.sea,a.cat),B=mvArea(b.kind,b.sea,b.cat);if(!A||!B)return;
  const va=mvReadTxt(A,a.kind,a.i),vb=mvReadTxt(B,b.kind,b.i);
  mvClearTxt(A,a.kind,a.i);mvClearTxt(B,b.kind,b.i);
  mvWriteTxt(B,b.kind,b.i,va);mvWriteTxt(A,a.kind,a.i,vb);
  if(A.tag&&B.tag){const ta=A.tag[a.i],tb=B.tag[b.i];delete A.tag[a.i];delete B.tag[b.i];if(ta)B.tag[b.i]=ta;if(tb)A.tag[a.i]=tb;}
  if(A.used&&B.used){const ua=A.used[a.i],ub=B.used[b.i];delete A.used[a.i];delete B.used[b.i];if(ua!==undefined)B.used[b.i]=ua;if(ub!==undefined)A.used[a.i]=ub;}
  if(a.kind==="pc"&&b.kind==="pc"){
    const ea=mvProdEntry(a.sea,a.cat,a.i),eb=mvProdEntry(b.sea,b.cat,b.i);
    if(ea!==undefined||eb!==undefined){
      const P=(sea,cat)=>{if(!S.produktion)S.produktion={};if(!S.produktion[sea])S.produktion[sea]={};if(!S.produktion[sea][cat])S.produktion[sea][cat]={};return S.produktion[sea][cat];};
      const pa=P(a.sea,a.cat),pb=P(b.sea,b.cat);
      delete pa[a.i];delete pb[b.i];
      if(ea!==undefined)pb[b.i]=ea;if(eb!==undefined)pa[a.i]=eb;
    }
  }
}
/* ══════════════════════════════════════════════════════════════════
   KONTEXTMENUE AUF BILDFLAECHEN
   Rechtsklick auf eine Bildflaeche: Bild entfernen (Flaeche bleibt) oder
   die Bildflaeche selbst entfernen. Nachfolgende Felder ruecken auf,
   die Feldanzahl des jeweiligen Bereichs wird um eins verringert.
   Rueckgaengig (Strg+Z / Einstellungen) gilt auch hier.
   ══════════════════════════════════════════════════════════════════ */
let _ctxItems=[],_ctxX=0,_ctxY=0;
function closeCtx(){const el=$("ctxMenu");if(el){el.classList.remove("open");el.innerHTML="";}_ctxItems=[];}
function openCtx(x,y,items){
  const el=$("ctxMenu");if(!el||!items.length)return;
  _ctxItems=items;_ctxX=x;_ctxY=y;
  el.innerHTML=items.map((it,ix)=>{
    if(it.sep)return '<div class="ctx-sep"></div>';
    if(it.head)return `<div class="ctx-head">${esc(it.head)}</div>`;
    const cls="ctx-item"+(it.more||it.note?" ctx-more":"")+(it.back?" ctx-back":"");
    const tail=it.more?'<span class="ctx-arr">&rsaquo;</span>':(it.note?`<span class="ctx-note">${esc(it.note)}</span>`:"");
    return `<button type="button" class="${cls}" data-ctx="${ix}"><span>${esc(it.label)}</span>${tail}</button>`;
  }).join("");
  el.style.left="-9999px";el.style.top="0px";el.classList.add("open");
  const r=el.getBoundingClientRect();
  const lx=Math.max(6,Math.min(x,window.innerWidth-r.width-8));
  const ly=Math.max(6,Math.min(y,window.innerHeight-r.height-8));
  el.style.left=lx+"px";el.style.top=ly+"px";
  el.querySelectorAll("[data-ctx]").forEach(b=>b.addEventListener("click",function(ev){
    ev.preventDefault();ev.stopPropagation();
    const it=_ctxItems[parseInt(this.dataset.ctx)];closeCtx();if(it&&it.run)it.run();
  }));
}

/* Anzahl der Bildflaechen an einer Stelle */
function fieldCount(loc){
  const p=String(loc||"").split("|"),sea=S.season;
  if(p[0]==="lk"){ensureLooks();return Math.max(S.looks[sea][p[1]].count||5,1);}
  if(p[0]==="pc"){ensurePieces();return Math.max(S.pieces[sea][p[1]].count||6,1);}
  if(p[0]==="sk")return Math.max(ensureSketches().count||6,1);
  if(p[0]==="mb")return Math.max((S.mbCount||{})[sea]||9,1);
  if(p[0]==="ib")return Math.max((S.ibCount||{})[IB_SEA]||9,1);
  return 0;
}
/* Index-basierte Ablagen nach dem Loeschen eines Feldes aufruecken */
function shiftIdxObj(o,from,last){
  if(!o||typeof o!=="object")return;
  for(let j=from;j<last;j++){const v=o[j+1];if(v===undefined)delete o[j];else o[j]=v;}
  delete o[last];
}
function clearImgField(loc){setImgAt(loc,null);save();render();}
function removeImgField(loc){
  const p=String(loc||"").split("|"),sea=S.season,n=fieldCount(loc);
  if(n<=1){toast("Mindestens eine Bildfl\u00e4che muss bleiben");return;}
  const last=n-1;
  if(p[0]==="lk"||p[0]==="pc"){
    let c;
    if(p[0]==="lk"){ensureLooks();c=S.looks[sea][p[1]];}else{ensurePieces();c=S.pieces[sea][p[1]];}
    if(!c)return;
    const i=parseInt(p[2]);
    shiftIdxObj(c.imgs,i,last);shiftIdxObj(c.titles,i,last);shiftIdxObj(c.metas,i,last);
    c.count=last;
    // Produktionsdaten haengen an den Piece-Indizes und muessen mitwandern
    if(p[0]==="pc"&&S.produktion&&S.produktion[sea]&&S.produktion[sea][p[1]])shiftIdxObj(S.produktion[sea][p[1]],i,last);
  }else if(p[0]==="sk"){
    const c=ensureSketches();const i=parseInt(p[1]);
    shiftIdxObj(c.imgs,i,last);shiftIdxObj(c.titles,i,last);shiftIdxObj(c.notes,i,last);shiftIdxObj(c.seas,i,last);
    c.count=last;
  }else if(p[0]==="mb"){
    const i=parseInt(p[1]);
    if(Array.isArray(S.moodboard[sea]))S.moodboard[sea].splice(i,1);
    if(S.mbCaptions&&S.mbCaptions[sea])shiftIdxObj(S.mbCaptions[sea],i,last);
    if(!S.mbCount)S.mbCount={};S.mbCount[sea]=last;
  }else if(p[0]==="ib"){
    const i=parseInt(p[1]);
    if(S.inspboard&&Array.isArray(S.inspboard[IB_SEA]))S.inspboard[IB_SEA].splice(i,1);
    if(S.ibCaptions&&S.ibCaptions[IB_SEA])shiftIdxObj(S.ibCaptions[IB_SEA],i,last);
    if(S.ibUsed&&S.ibUsed[IB_SEA])shiftIdxObj(S.ibUsed[IB_SEA],i,last);
    if(!S.ibCount)S.ibCount={};S.ibCount[IB_SEA]=last;
  }else return;
  save();render();toast("Bildfl\u00e4che entfernt");
}
/* ══════════════════════════════════════════════════════════════════
   BILD VERSCHIEBEN — in eine andere Saison und/oder einen anderen Reiter
   Ablauf im Kontextmenue: Saison → Reiter (→ Kategorie bei Looks/Pieces).
   Ziel ist das erste komplett leere Feld; gibt es keins, wird am Ende ein
   neues Feld angelegt. Die Quellflaeche bleibt als leeres Feld stehen.
   Texte wandern mit, wenn das Ziel dasselbe Feld kennt (Titel, Meta,
   Sketch-Notiz, Board-Notiz); Produktionsdaten wandern von Piece zu Piece mit.
   ══════════════════════════════════════════════════════════════════ */
function mvArea(kind,sea,cat){
  const obj=(o,k)=>{if(!o[k]||typeof o[k]!=="object")o[k]={};return o[k];};
  if(kind==="lk"||kind==="pc"){
    const root=kind==="lk"?(S.looks||(S.looks={})):(S.pieces||(S.pieces={}));
    const def=kind==="lk"?5:6;
    const sc=obj(root,sea);
    if(!sc[cat])sc[cat]={imgs:{},titles:{},metas:{},count:def};
    const c=sc[cat];
    return {img:obj(c,"imgs"),txt:{title:obj(c,"titles"),meta:obj(c,"metas")},
      count:()=>Math.max(c.count||def,1),setCount:n=>{c.count=n;}};
  }
  if(kind==="sk"){
    const c=ensureSketches();
    return {img:c.imgs,txt:{title:c.titles,note:c.notes},tag:c.seas,
      count:()=>Math.max(c.count||6,1),setCount:n=>{c.count=n;}};
  }
  if(kind==="mb"){
    if(!S.moodboard)S.moodboard={};
    if(!Array.isArray(S.moodboard[sea]))S.moodboard[sea]=Array(9).fill(null);
    if(!S.mbCaptions)S.mbCaptions={};if(!S.mbCount)S.mbCount={};
    return {img:S.moodboard[sea],txt:{cap:obj(S.mbCaptions,sea)},
      count:()=>Math.max(S.mbCount[sea]||9,1),setCount:n=>{S.mbCount[sea]=n;}};
  }
  if(kind==="ib"){
    if(!S.inspboard)S.inspboard={};
    if(!Array.isArray(S.inspboard[IB_SEA]))S.inspboard[IB_SEA]=Array(9).fill(null);
    if(!S.ibCaptions)S.ibCaptions={};if(!S.ibCount)S.ibCount={};if(!S.ibUsed)S.ibUsed={};
    return {img:S.inspboard[IB_SEA],txt:{cap:obj(S.ibCaptions,IB_SEA)},used:obj(S.ibUsed,IB_SEA),
      count:()=>Math.max(S.ibCount[IB_SEA]||9,1),setCount:n=>{S.ibCount[IB_SEA]=n;}};
  }
  return null;
}
function mvProdEntry(sea,cat,i){const p=S.produktion&&S.produktion[sea]&&S.produktion[sea][cat];return p?p[i]:undefined;}
function mvProdFilled(e){return !!(e&&typeof e==="object"&&Object.keys(e).some(k=>Array.isArray(e[k])?e[k].length:(e[k]!=null&&e[k]!=="")));}
/* Quelle einer Bildflaeche als {kind,sea,cat,i} */
function mvSource(loc){
  const p=String(loc||"").split("|");
  if(p[0]==="lk"||p[0]==="pc")return {kind:p[0],sea:S.season,cat:p[1],i:parseInt(p[2])};
  if(p[0]==="sk")return {kind:"sk",sea:null,cat:null,i:parseInt(p[1])};
  if(p[0]==="mb")return {kind:"mb",sea:S.season,cat:null,i:parseInt(p[1])};
  if(p[0]==="ib")return {kind:"ib",sea:IB_SEA,cat:null,i:parseInt(p[1])};
  return null;
}
function mvSame(src,kind,sea,cat){
  if(src.kind!==kind)return false;
  if(kind==="ib"||kind==="sk")return true; // saisonunabhängige Bereiche
  return src.sea===sea&&(src.cat||null)===(cat||null);
}
function mvKindLabel(kind,cat){
  if(kind==="lk")return subLbl("looks")+" \u00b7 "+catLbl("lk",cat);
  if(kind==="pc")return subLbl("pieces")+" \u00b7 "+catLbl("pc",cat);
  if(kind==="sk")return subLbl("sketches");
  if(kind==="mb")return getLabel("moodboards");
  if(kind==="ib")return getLabel("inspiration");
  return kind;
}
function moveImgTo(loc,kind,sea,cat){
  const src=mvSource(loc);if(!src)return false;
  if(mvSame(src,kind,sea,cat))return false;
  const A=mvArea(src.kind,src.sea,src.cat),B=mvArea(kind,sea,cat);
  if(!A||!B)return false;
  const img=A.img[src.i];if(!img)return false;
  // erstes komplett leeres Zielfeld suchen, sonst ein neues anhaengen
  const n=B.count();let j=-1;
  for(let k=0;k<n;k++){
    if(B.img[k])continue;
    if(Object.keys(B.txt).some(f=>String(B.txt[f][k]||"").trim()))continue;
    if(kind==="pc"&&mvProdFilled(mvProdEntry(sea,cat,k)))continue;
    j=k;break;
  }
  if(j<0){j=n;B.setCount(n+1);}
  B.img[j]=img;A.img[src.i]=null;
  // Texte wandern immer mit dem Bild (fehlende Zielfelder → ins letzte Textfeld)
  const vals=mvReadTxt(A,src.kind,src.i);
  mvClearTxt(A,src.kind,src.i);
  mvWriteTxt(B,kind,j,vals);
  if(A.tag)delete A.tag[src.i];
  if(B.tag){if(kind==="sk"&&seaTagKnown(sea))B.tag[j]=sea;else delete B.tag[j];}
  if(B.used)delete B.used[j];
  if(A.used)delete A.used[src.i];
  if(src.kind==="pc"&&kind==="pc"){
    const e=mvProdEntry(src.sea,src.cat,src.i);
    if(e!==undefined){
      if(!S.produktion)S.produktion={};if(!S.produktion[sea])S.produktion[sea]={};if(!S.produktion[sea][cat])S.produktion[sea][cat]={};
      S.produktion[sea][cat][j]=e;delete S.produktion[src.sea][src.cat][src.i];
    }
  }
  save();render();
  const seaTxt=kind==="ib"?"":(((S.seasonLabels||{})[sea]||sea)+" \u00b7 ");
  toast("Bild verschoben nach "+seaTxt+mvKindLabel(kind,cat));
  return true;
}
function ctxMoveSeasons(loc){
  const seas=(S.seasons&&S.seasons.length)?S.seasons:["fw28","ss29"];
  const items=[{head:"Verschieben \u2014 Saison"}];
  const srcK=(mvSource(loc)||{}).kind;const cur=k=>k===S.season&&srcK!=="sk";
  seas.forEach(k=>items.push({label:(S.seasonLabels||{})[k]||k,note:cur(k)?"Aktuell":"",more:!cur(k),run:()=>ctxMoveTabs(loc,k)}));
  items.push({sep:true},{label:"\u2039 Zur\u00fcck",back:true,run:()=>openCtx(_ctxX,_ctxY,imgCtxItems(loc))});
  openCtx(_ctxX,_ctxY,items);
}
function ctxMoveTabs(loc,sea){
  const src=mvSource(loc);if(!src)return;
  const seaLbl=(S.seasonLabels||{})[sea]||sea;
  const items=[{head:seaLbl+" \u2014 Reiter"}];
  const catsLeft=(kind,list)=>list.filter(([k])=>!mvSame(src,kind,sea,k));
  if(catsLeft("lk",LOOK_CATS).length)items.push({label:subLbl("looks"),more:true,run:()=>ctxMoveCats(loc,sea,"lk")});
  if(catsLeft("pc",PIECE_CATS).length)items.push({label:subLbl("pieces"),more:true,run:()=>ctxMoveCats(loc,sea,"pc")});
  if(!mvSame(src,"sk",sea))items.push({label:subLbl("sketches"),run:()=>moveImgTo(loc,"sk",sea)});
  if(!mvSame(src,"mb",sea))items.push({label:getLabel("moodboards"),run:()=>moveImgTo(loc,"mb",sea)});
  if(!mvSame(src,"ib",sea))items.push({label:getLabel("inspiration"),note:"Alle Saisons",run:()=>moveImgTo(loc,"ib",sea)});
  items.push({sep:true},{label:"\u2039 Zur\u00fcck",back:true,run:()=>ctxMoveSeasons(loc)});
  openCtx(_ctxX,_ctxY,items);
}
function ctxMoveCats(loc,sea,kind){
  const src=mvSource(loc);if(!src)return;
  const list=kind==="lk"?LOOK_CATS:PIECE_CATS;
  const seaLbl=(S.seasonLabels||{})[sea]||sea;
  const items=[{head:seaLbl+" \u2014 "+subLbl(kind==="lk"?"looks":"pieces")}];
  list.forEach(([k])=>{if(!mvSame(src,kind,sea,k))items.push({label:catLbl(kind,k),run:()=>moveImgTo(loc,kind,sea,k)});});
  items.push({sep:true},{label:"\u2039 Zur\u00fcck",back:true,run:()=>ctxMoveTabs(loc,sea)});
  openCtx(_ctxX,_ctxY,items);
}
function imgCtxItems(loc){
  const items=[];
  const has=!!getImgAt(loc);
  if(has)items.push({label:"Bild entfernen",run:()=>clearImgField(loc)});
  items.push({label:"Bildfl\u00e4che entfernen",run:()=>removeImgField(loc)});
  if(has&&mvSource(loc))items.push({sep:true},{label:"Bild verschieben",more:true,run:()=>ctxMoveSeasons(loc)});
  return items;
}
function bindImgCtx(el,loc){
  el.addEventListener("contextmenu",function(e){
    e.preventDefault();e.stopPropagation();
    openCtx(e.clientX,e.clientY,imgCtxItems(loc));
  });
}
function bindImgDrag(m){
  m.querySelectorAll("[data-imgloc]").forEach(el=>{
    const loc=el.dataset.imgloc;
    bindImgCtx(el,loc);
    el.addEventListener("dragstart",function(e){
      if(!getImgAt(loc)){e.preventDefault();return;}
      dragImgLoc=loc;e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",loc);}catch(_){}
      this.classList.add("img-dragging");
    });
    el.addEventListener("dragend",function(){dragImgLoc=null;this.classList.remove("img-dragging");m.querySelectorAll(".imgdrop-over").forEach(x=>x.classList.remove("imgdrop-over"));});
    el.addEventListener("dragover",function(e){e.preventDefault();e.dataTransfer.dropEffect="move";this.classList.add("imgdrop-over");});
    el.addEventListener("dragleave",function(){this.classList.remove("imgdrop-over");});
    el.addEventListener("drop",function(e){
      e.preventDefault();e.stopPropagation();this.classList.remove("imgdrop-over");
      // Externe Bilddatei (z. B. aus dem Finder) direkt ins Feld ziehen
      if(!dragImgLoc&&e.dataTransfer.files&&e.dataTransfer.files[0]){
        const f=e.dataTransfer.files[0];if(!/^image\//.test(f.type))return;
        readMedia(f,v=>{setImgAt(loc,v);save();render();});return;
      }
      if(!dragImgLoc||dragImgLoc===loc)return;
      const a=getImgAt(dragImgLoc),b=getImgAt(loc);
      setImgAt(loc,a);setImgAt(dragImgLoc,b); // leer = verschieben, belegt = Plätze tauschen
      swapLocMeta(dragImgLoc,loc); // Texte (Titel, Meta, Notiz, Beschriftung) wandern mit dem Bild
      dragImgLoc=null;save();render();
    });
  });
}
function addField(){
  const sea=S.season;

}

      return '<div class="note-att note-att-im" data-nattctx="'+n.id+"|"+f.id+'"><img class="note-att-img" data-nattimg="1" src="'+MU(f.data)+'" alt="'+nm+'" title="'+nm+'"></div>';
    return '<div class="note-att"><a class="note-att-file" href="'+MF(f.data)+'" download="'+nm+'" title="'+nm+'">'+
             '<span class="note-att-nm">'+esc(f.name||"Datei")+'</span>'+
             '<span class="note-att-sz">'+esc(noteFileSize(f.size))+'</span></a>'+del+'</div>';
  }).join("")+"</div>";
}
function addNoteFiles(n,fileList){
  const arr=Array.prototype.slice.call(fileList||[]);
  if(!n||!arr.length)return;
  let left=arr.length,added=0,skipped=0;
  const done=()=>{
    if(left>0)return;
    if(added){n.upd=Date.now();save();renderNotesList();}
    if(skipped)toast(skipped===1?"Datei zu groß (max. 10 MB)":skipped+" Dateien zu groß (max. 10 MB)");
  };
  arr.forEach(file=>{
    if(file.size>NOTE_FILE_MAX){skipped++;left--;done();return;}
    readMedia(file,v=>{
      noteFiles(n).push({
        id:"f"+Date.now()+Math.floor(Math.random()*10000),
        name:file.name||"Datei",type:file.type||"",size:file.size||0,data:v
      });
      added++;left--;done();
    },()=>{skipped++;left--;done();});
  });
}

      '<button class="note-del" data-ndel="'+n.id+'" title="Notiz löschen">&#10005;</button>'+
      '<input class="note-ttl" type="text" placeholder="Titel" value="'+esc(n.title||"").replace(/"/g,"&quot;")+'">'+
      '<textarea class="note-body" placeholder="Notiz&hellip;" rows="1">'+esc(n.body||"")+'</textarea>'+
      noteAttsHtml(n)+
      '<div class="note-foot">'+
        '<button class="note-add" data-nadd="'+n.id+'" title="Dateien oder Bilder hinzufügen"><span class="npl">+</span>Datei</button>'+

function addNote(){
  const now=Date.now();
  notesArr(notesCat).unshift({id:"n"+now+Math.floor(Math.random()*1000),title:"",body:"",files:[],ts:now,upd:now});
  save();renderNotes();
  const first=document.querySelector("#notesList .note-card .note-ttl");
  if(first)first.focus();

}
function findNote(id){
  for(const c of NOTE_CATS){const a=notesArr(c.id);const i=a.findIndex(n=>n.id===id);if(i>-1)return{arr:a,i:i,n:a[i]};}
  return null;
}
function initNotes(){
  const fab=$("notesFab");
  // Klick auf den Button öffnet direkt die Notizen; Sketches sind oben im Panel wählbar
  if(fab)fab.addEventListener("click",e=>{e.stopPropagation();closeNotesChooser();if(notesIsOpen())closeNotes();else openNotes();});
  const swS=$("npSwSketches");
  if(swS)swS.addEventListener("click",e=>{e.stopPropagation();closeNotes();if(S.sec!=="sketches")navTo("sketches");});
  const nch=$("notesChooser");
  if(nch)nch.addEventListener("click",e=>{
    const b=e.target.closest("[data-nchoose]");if(!b)return;
    e.stopPropagation();closeNotesChooser();
    if(b.dataset.nchoose==="notes")openNotes();
    else if(S.sec!=="sketches")navTo("sketches");
  });
  document.addEventListener("mousedown",e=>{if(chooserIsOpen()&&!e.target.closest("#notesChooser")&&!e.target.closest("#notesFab"))closeNotesChooser();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&chooserIsOpen())closeNotesChooser();});
  const cb=$("notesCloseBtn");if(cb)cb.addEventListener("click",closeNotes);
  const sc=$("notesScrim");if(sc)sc.addEventListener("click",closeNotes);
  const ab=$("notesAddBtn");if(ab)ab.addEventListener("click",addNote);
  const tabs=$("notesTabs");
  if(tabs)tabs.addEventListener("click",e=>{
    const b=e.target.closest("[data-ncat]");if(!b)return;
    notesCat=b.dataset.ncat;renderNotesTabs();renderNotesList();
  });
  const list=$("notesList");
  if(list){
    list.addEventListener("input",e=>{
      const card=e.target.closest(".note-card");if(!card)return;
      const f=findNote(card.dataset.nid);if(!f)return;
      if(e.target.classList.contains("note-ttl"))f.n.title=e.target.value;
      else if(e.target.classList.contains("note-body")){f.n.body=e.target.value;autoGrow(e.target);}
      else return;
      f.n.upd=Date.now();
      const meta=card.querySelector(".note-meta");if(meta)meta.textContent=noteDate(f.n.upd);
      save();
    });
    list.addEventListener("click",e=>{
      const d=e.target.closest("[data-ndel]");if(!d)return;
      const f=findNote(d.dataset.ndel);if(!f)return;
      const label=(f.n.title||"").trim()||(f.n.body||"").trim().slice(0,40);
      if((f.n.title||f.n.body)&&!confirm("Notiz "+(label?'„'+label+'“ ':"")+"wirklich löschen?"))return;
      f.arr.splice(f.i,1);save();renderNotes();toast("Notiz gelöscht");
    });
    // Anhänge: Plus-Button, Entfernen, Bildvorschau
    list.addEventListener("click",e=>{
      const add=e.target.closest("[data-nadd]");
      if(add){
        const inp=list.querySelector('input[data-nfile="'+add.dataset.nadd+'"]');
        if(inp){inp.value="";inp.click();}
        return;
      }
      const ad=e.target.closest("[data-nattdel]");
      if(ad){
        const p=ad.dataset.nattdel.split("|");
        removeNoteAtt(p[0],p[1]);
        return;
      }
      const im=e.target.closest("[data-nattimg]");
      if(im&&typeof openLightbox==="function"){let v=im.src;const w=im.closest("[data-nattctx]");if(w){const p=w.dataset.nattctx.split("|");const fn=findNote(p[0]);const at=fn&&noteFiles(fn.n).find(x=>String(x.id)===String(p[1]));if(at&&at.data)v=at.data;}openLightbox(v);}
    });
    list.addEventListener("contextmenu",e=>{
      const w=e.target.closest("[data-nattctx]");if(!w)return;
      e.preventDefault();e.stopPropagation();
      const p=w.dataset.nattctx.split("|");
      openCtx(e.clientX,e.clientY,[{label:"Bild entfernen",run:()=>removeNoteAtt(p[0],p[1])}]);
    });
    list.addEventListener("change",e=>{
      const sel=e.target.closest("[data-nsea]");
      if(sel){
        const f=findNote(sel.dataset.nsea);if(!f)return;
        if(sel.value)f.n.sea=sel.value;else delete f.n.sea;
        f.n.upd=Date.now();
        const card=sel.closest(".note-card");const meta=card&&card.querySelector(".note-meta");if(meta)meta.textContent=noteDate(f.n.upd);
        save();return;
      }
      const inp=e.target.closest("[data-nfile]");if(!inp)return;
      const f=findNote(inp.dataset.nfile);if(!f)return;
      addNoteFiles(f.n,inp.files);inp.value="";
    });
    // Dateien direkt auf eine Notiz ziehen
    const hasFiles=dt=>!!(dt&&dt.types&&Array.prototype.indexOf.call(dt.types,"Files")>-1);
    list.addEventListener("dragover",e=>{
      const c=e.target.closest(".note-card");if(!c||!hasFiles(e.dataTransfer))return;
      e.preventDefault();e.dataTransfer.dropEffect="copy";c.classList.add("natt-over");
    });
    list.addEventListener("dragleave",e=>{
      const c=e.target.closest(".note-card");if(c&&!c.contains(e.relatedTarget))c.classList.remove("natt-over");
    });
    list.addEventListener("drop",e=>{
      const c=e.target.closest(".note-card");if(!c)return;
      c.classList.remove("natt-over");
      if(!(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length))return;
      e.preventDefault();e.stopPropagation();
      const f=findNote(c.dataset.nid);if(!f)return;
      addNoteFiles(f.n,e.dataTransfer.files);
    });
  }
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&notesIsOpen())closeNotes();});
  updateNotesBadge();
}

async function init(){
  await openDB();
  S=await loadStateAsync();

  await mediaInit();
  try{const n=await migrateLegacyMedia();if(n)toast(n===1?"Speicher umgestellt · 1 Datei":"Speicher umgestellt · "+n+" Dateien");}
  catch(e){hideBusy();toast("Umstellung gerade nicht möglich – das Dashboard läuft wie bisher weiter");}
  // Migration: früher vorbelegter Platzhaltertext im Inspiration Book entfernen,
  // damit die Felder wirklich leer sind und der Platzhalter nur noch grau angedeutet wird.
  try{
    if(!S.inspPhMigrated){
      const PH_T=["neuer eintrag","neuer eintrag…","titel","titel…"];
      const PH_B=["beschreibung","beschreibung…"];
      const PH_G=["tag","tag…"];
      const cl=(v,list)=>list.indexOf(String(v||"").trim().toLowerCase())>-1?"":v;
      (S.inspirations||[]).forEach(i=>{i.title=cl(i.title,PH_T);i.body=cl(i.body,PH_B);i.tag=cl(i.tag,PH_G);});
      S.inspPhMigrated=true;save();
    }
  }catch(e){}

  // Migration: Inspiration Book war früher pro Saison getrennt gespeichert.
  // Ab jetzt ist der Inhalt saisonunabhängig (ein gemeinsamer Stand "all").
  try{
    if(!S.ibMigratedToShared){
      const seasons=["fw28","ss29"];
      if(!S.inspboard)S.inspboard={};
      if(!S.inspboard.all)S.inspboard.all=[];
      const maxLen=Math.max(S.inspboard.all.length,...seasons.map(s=>(S.inspboard[s]||[]).length),9);
      const merged=Array(maxLen).fill(null);
      for(let i=0;i<maxLen;i++){
        merged[i]=S.inspboard.all[i]||seasons.map(s=>(S.inspboard[s]||[])[i]).find(v=>v)||null;
      }
      S.inspboard={all:merged};
      const capSeasons=seasons.map(s=>(S.ibCaptions||{})[s]||{});
      S.ibCaptions={all:Object.assign({},...capSeasons,(S.ibCaptions||{}).all||{})};
      const countSeasons=seasons.map(s=>(S.ibCount||{})[s]||0);
      S.ibCount={all:Math.max((S.ibCount||{}).all||0,...countSeasons,9)};
      S.ibMigratedToShared=true;save();
    }
  }catch(e){}

  // Migration: Sketches sind saisonunabhängig (ein gemeinsamer Bestand)
  try{ensureSketches();}catch(e){}

  // Migration: alte Standard-Serifenschrift auf neue Sans-Serif umstellen
  if(S.settings&&/Cormorant|Garamond/.test(S.settings.font||"")){S.settings.font='"Helvetica Neue",Helvetica,Arial,sans-serif';}

  // Reiter always visible from start (overlay); only logo can hide them
  S.sidebarOpen=true;$("sidebar").classList.add("open");
  renderSeasonBar();
  // clear any default nav items first to avoid duplicates
  $("customNav").innerHTML="";
  S.customs.forEach(c=>addCustomNavItem(c.id,c.name));
  applyNavLabels();
  // restore which accordions were open
  (S.openAccs||[]).forEach(id=>{const acc=document.querySelector('.acc[data-acc="'+id+'"]');if(acc)acc.classList.add("open");});
  // restore tabs hidden state
  S.tabsHidden=false;$("accList").classList.remove("tabs-hidden");
  // restore active sub-item
  if(S.sec&&S.sub){const ss2=$("ss-"+S.sub);if(ss2)ss2.classList.add("active");}

  applySettings();render();
  initNotes();
  histInit();
  // Hintergrundpflege: Aufraeumen, Speicherschutz, Backup-Erinnerung, Update-Pruefung
  setTimeout(()=>{try{mediaGC();mediaHousekeeping();requestPersist();backupReminder();checkForUpdate(true);}catch(e){}},1500);
}

/* ── Leere Schlusszeilen abraeumen ───────────────────────────────────────────
   Wird in einem Feld Enter gedrueckt, danach aber nichts mehr geschrieben,
   bleibt eine leere Zeile stehen und schiebt das Layout nach unten.
   Beim Verlassen des Feldes (blur) wird dieser Rest wieder entfernt —
   waehrend des Tippens bleibt die neue Zeile selbstverstaendlich erhalten. */
function trimTrailBlank(v){return String(v==null?"":v).replace(/[\s\u00a0]+$/,"");}
function normalizeCe(el){
  const raw=ceRaw(el).replace(/\u00a0/g," ");
  const clean=trimTrailBlank(raw);
  if(!clean){if(el.innerHTML!=="")el.innerHTML="";return "";}
  // white-space:pre-wrap haelt echte Zeilenumbrueche, daher reicht textContent
  if(clean!==raw)el.textContent=clean;
  return clean;
}
function normalizeTa(el){
  const clean=trimTrailBlank(el.value);
  if(clean===el.value)return clean;
  el.value=clean;
  // bestehende input-Handler uebernehmen den gekuerzten Wert in den State
  try{el.dispatchEvent(new Event("input",{bubbles:true}));}catch(_){}
  if(el.classList.contains("mbc-cap"))syncCapHeights();
  else if(el.style.height)autoGrow(el);
  return clean;
}
function isEditableEl(el){
  if(el.isContentEditable)return true;
  const a=el.getAttribute&&el.getAttribute("contenteditable");
  return a!=null&&a!=="false";
}
// blur steigt nicht auf -> Capture-Phase, damit wir vor den Feld-Handlern laufen
document.addEventListener("blur",function(e){
  const t=e.target;
  if(!t||t.nodeType!==1)return;
  try{
    if(t.tagName==="TEXTAREA")normalizeTa(t);
    else if(isEditableEl(t))normalizeCe(t);
  }catch(_){}
},true);

  function norm(u){return u.trim().toLowerCase().replace(/\s+/g," ");}
  function djb2(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)+s.charCodeAt(i))>>>0;}return h;}
  function sha256(s){
    if(window.crypto&&crypto.subtle&&window.TextEncoder){
      return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(buf){
        return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
      });
    }
    return Promise.reject();
  }
  function grant(u){
    if(window.MFNAuth)window.MFNAuth.user=u||null;
    ov.classList.add("hidden");
    document.body.style.overflow="";
  }
  function deny(){
    var err=document.getElementById("loginErr");
    err.classList.add("show");
    ov.classList.add("shake");
    setTimeout(function(){ov.classList.remove("shake");},400);
    document.getElementById("loginPass").value="";
    document.getElementById("loginPass").focus();
  }
  function attempt(){
    var u=norm(document.getElementById("loginUser").value);
    var p=document.getElementById("loginPass").value.trim();
    var s=u+"|"+p;
    var c=readAuth();
    sha256(s).then(function(h){(c?h===c.h:h===HASH)?grant(u):deny();})
      .catch(function(){var f=djb2(s);((c&&typeof c.f==="number")?f===c.f:f===FHASH)?grant(u):deny();});
  }
  window.MFNAuth={
    user:null,
    isCustom:function(){return !!readAuth();},
    verify:function(user,pass){
      var str=norm(String(user||""))+"|"+String(pass==null?"":pass).trim();
      var c=readAuth();
      return sha256(str).then(function(h){return c?h===c.h:h===HASH;})
        .catch(function(){var f=djb2(str);return (c&&typeof c.f==="number")?f===c.f:f===FHASH;});
    },
    setPassword:function(user,pass){
      var str=norm(String(user||""))+"|"+String(pass==null?"":pass).trim();
      var f=djb2(str);
      return sha256(str).then(function(h){
        localStorage.setItem(PWKEY,JSON.stringify({h:h,f:f,t:Date.now()}));
        return true;
      });
    },
    reset:function(){try{localStorage.removeItem(PWKEY);}catch(e){}return !readAuth();}
  };

    var HIDE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.5 5.2 12 5.2 22.2 12 22.2 12 18.5 18.8 12 18.8 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3.5 3.5 20.5 20.5"/></svg>';
    btn.innerHTML=SHOW;
    btn.addEventListener("click",function(e){
      e.preventDefault();
      var show=inp.type==="password";
      inp.type=show?"text":"password";
      btn.innerHTML=show?HIDE:SHOW;
      btn.setAttribute("aria-label",show?"Passwort verbergen":"Passwort anzeigen");
      btn.setAttribute("title",show?"Passwort verbergen":"Passwort anzeigen");
      inp.focus();
    });
  })();
  setTimeout(function(){document.getElementById("loginUser").focus();},150);
})();

</script>
</body>
</html>
